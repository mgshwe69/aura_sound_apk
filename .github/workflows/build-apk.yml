name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/checkout@v3
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Generate Android Project & APK
        run: |
          npx @bubblewrap/cli init --manifest=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json --directory=android-app
          cd android-app
          npx @bubblewrap/cli build

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Suiii7Sound-APK
          path: android-app/*.apk
