/* AURA SOUNDS — cinematic artist experience refresh */
.artist-cinematic{position:relative;min-height:calc(100svh - 78px);margin:-24px calc(clamp(14px,3vw,38px) * -1) 34px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,3vw,38px);background:#09070f;border-bottom:1px solid #ffffff18}
.artist-cinematic .artist-bg{position:absolute;inset:-9%;z-index:-3;background-size:cover;background-position:center 30%;will-change:transform;pointer-events:none}
.artist-cinematic .artist-bg-back{filter:blur(1.5px) saturate(.9);opacity:.5;transform:scale(1.16)}
.artist-cinematic .artist-bg-front{opacity:.38;mix-blend-mode:screen;mask-image:linear-gradient(90deg,black,transparent 92%);transform:scale(1.06)}
.artist-vignette{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#08070ff2 0%,#0b0816c9 42%,#0b081655 100%),linear-gradient(0deg,#09070f 0%,transparent 38%,#09070f55 100%);pointer-events:none}
.artist-cinematic-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.artist-cinematic-copy{width:min(880px,100%);padding:clamp(38px,8vh,100px) 0 22px;animation:artistRise .75s cubic-bezier(.2,.75,.2,1) both}
.artist-cinematic-copy h1{font-size:clamp(48px,9vw,112px);letter-spacing:-.065em;line-height:.94;max-width:1000px;margin:20px 0 18px;text-wrap:balance;text-shadow:0 8px 44px #0008}
.artist-tagline{max-width:620px;font-size:clamp(16px,2vw,21px);color:#e6def4;margin:0 0 12px}
.artist-facts{display:flex;flex-wrap:wrap;gap:9px;align-items:center;color:#c9c1db;font-size:13px;margin:0 0 24px}.artist-facts span{color:#a78bfa}
.artist-pulse{width:8px;height:8px;border-radius:50%;background:#c4b5fd;box-shadow:0 0 18px #a78bfa;display:inline-block}
.artist-hero-credit{font-size:12px;color:#d5cde3;margin-top:30px}.artist-hero-credit strong{color:#fff}
.artist-scroll-cue{display:flex;align-items:center;gap:10px;margin-top:clamp(22px,5vh,54px);font-size:10px;letter-spacing:2px;color:#bcb4d0}.artist-scroll-cue span{height:34px;width:1px;background:linear-gradient(#c4b5fd,transparent);display:inline-block;animation:cuePulse 1.8s ease-in-out infinite}
.artist-content-section{animation:artistRise .5s ease both}.artist-about{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#201630,#101019);margin-top:35px}.artist-about h2{font-size:clamp(26px,4vw,42px);margin:8px 0}.artist-about p{color:var(--muted)}
@keyframes artistRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes cuePulse{0%,100%{opacity:.45;transform:scaleY(.8);transform-origin:top}50%{opacity:1;transform:scaleY(1);transform-origin:top}}

 }
 if(!source&&t.previewUrl){source=t.previewUrl;label='Loading catalog preview…'}

}

function confirmAction(title,desc,yes){openModal(`<div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close-modal>×</button></div><p class="muted">${esc(desc)}</p><div class="button-row" style="justify-content:end"><button class="btn secondary" data-close-modal>Cancel</button><button class="btn primary" id="confirmYes">Confirm</button></div>`);$('#confirmYes').onclick=()=>{closeModal();yes()}}
function openAuth(mode='login'){openModal(`<div class="modal-head"><h2>${mode==='signup'?'Create your guest profile':'Welcome back'}</h2><button class="icon-btn" data-close-modal aria-label="Close">×</button></div><div class="notice">Guest profile only. Secure account authentication and cross-device sync require a configured backend.</div><form id="authForm"><div class="field"><label for="authName">Display name ${mode==='login'?'':'(required)'}</label><input id="authName" ${mode==='signup'?'required':''} maxlength="50" placeholder="Your name" value="${esc(state.user?.name||'')}"></div><div class="field"><label for="authEmail">Email (optional; not sent anywhere)</label><input id="authEmail" type="email" placeholder="you@example.com"></div><button class="btn primary" type="submit" style="width:100%">${mode==='signup'?'Continue as guest':'Continue'}</button></form>`);$('#authForm').onsubmit=e=>{e.preventDefault();const name=$('#authName').value.trim()||(mode==='login'?'Guest':'');if(!name){toast('Please enter a display name');return}state.user={name,mode:'guest'};persist();$('#accountBtn').textContent=name[0].toUpperCase();closeModal();toast(`Welcome, ${name}! Guest profile saved on this device.`)}}
async function shareUrl(title){const url=location.href;try{if(navigator.share){await navigator.share({title:`${title} · Aura Sounds`,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);toast('Link copied to clipboard')}catch{openModal(`<div class="modal-head"><h2>Share Aura Sounds</h2><button class="icon-btn" data-close-modal>×</button></div><p class="muted">Copy this link to share.</p><div class="field"><label for="shareLink">Page link</label><input id="shareLink" readonly value="${esc(url)}"></div><button class="btn primary" id="copyShare" style="width:100%">Select link</button>`);$('#copyShare').onclick=()=>{$('#shareLink').select();toast('Link selected — copy it from your browser')}}}
function openDrawer(){const root=$('#drawerRoot');root.innerHTML=`<div class="drawer" id="drawer"><div class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center"><strong>AURA SOUNDS</strong><button class="icon-btn" id="closeDrawer">×</button></div>${['home','search','explore','liked','playlists','recent','queue','settings'].map(p=>`<button class="navitem" data-drawer-page="${p}">${({home:'⌂ Home',search:'⌕ Search',explore:'✦ Explore',liked:'♡ Liked songs',playlists:'▤ Playlists',recent:'◷ Recently played',queue:'≡ Play queue',settings:'⚙ Settings'})[p]}</button>`).join('')}<button class="btn secondary" id="drawerCreate">＋ New playlist</button></div></div>`;$('#closeDrawer').onclick=()=>root.innerHTML='';$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')root.innerHTML=''});$$('[data-drawer-page]').forEach(b=>b.onclick=()=>{root.innerHTML='';setPage(b.dataset.drawerPage)});$('#drawerCreate').onclick=()=>{root.innerHTML='';createPlaylist()}}
function openExpanded(){if(!state.current){toast('Play a track first to open the expanded player.');return}state.expanded=true;const t=state.current;$('#expandedRoot').innerHTML=`<div class="expanded"><div class="expanded-top"><button class="control" id="expandedClose" aria-label="Close expanded player">⌄</button><span class="eyebrow">NOW PLAYING</span><button class="control" id="expandedLyrics" aria-label="Open song lyrics">♫ Lyrics</button><button class="control" id="expandedShare" aria-label="Share track">↗</button></div><div class="expanded-body"><div><img class="expanded-art" src="${esc(art(t,600))}" alt="${esc(t.trackName)} artwork"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px"><div style="min-width:0"><h1>${esc(t.trackName)}</h1><p class="muted">${esc(t.artistName)} · ${esc(t.collectionName)}</p></div><button class="control" id="expandedLike">${state.liked.includes(String(t.trackId))?'♥':'♡'}</button></div><div class="controls" style="margin-top:20px"><button class="control" id="expandedPrev">◀◀</button><button class="control play" id="expandedPlay">${state.playing?'Ⅱ':'▶'}</button><button class="control" id="expandedNext">▶▶</button></div><div class="progress-row" style="margin-top:12px"><span id="expandedCurrent">${fmt(audio.currentTime)}</span><input class="range" id="expandedProgress" type="range" min="0" max="1000" value="0" aria-label="Expanded player seek"><span id="expandedDuration">${fmt(audio.duration)}</span></div></div><div class="queue-side"><h2>Up next</h2><p class="muted tiny">Your current queue</p><div class="queue-list">${state.queue.map((q,i)=>`<div class="result" data-queue-index="${i}">${imageTag(q,'',q.trackName)}<div class="result-info"><strong>${esc(q.trackName)}</strong><span>${esc(q.artistName)}</span></div>${i===state.queueIndex?'<span>♫</span>':''}</div>`).join('')||'<p class="muted">Queue is empty.</p>'}</div><button class="btn secondary" id="expandedQueue" style="margin-top:12px">Open full queue</button></div></div></div>`;$('#expandedClose').onclick=closeExpanded;$('#expandedLyrics').onclick=()=>window.openAuraLyrics?.();$('#expandedShare').onclick=()=>shareUrl(`${t.trackName} — ${t.artistName}`);$('#expandedLike').onclick=()=>toggleLike(t.trackId);$('#expandedPlay').onclick=togglePlayback;$('#expandedPrev').onclick=()=>playNext(-1);$('#expandedNext').onclick=()=>playNext(1);$('#expandedQueue').onclick=()=>{closeExpanded();setPage('queue')};$('#expandedProgress').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*Number(e.target.value)/1000};$$('[data-queue-index]').forEach(b=>b.onclick=()=>{state.queueIndex=Number(b.dataset.queueIndex);playTrack(state.queue[state.queueIndex]);openExpanded()})}
function closeExpanded(){state.expanded=false;$('#expandedRoot').innerHTML=''}
function togglePlayback(){if(!state.current){toast('Choose a track from search first.');focusSearch();return}if(!(state.current.fullTrackUrl||state.current.previewUrl||audio.src)){toast('No playable audio URL is available for this track.');return}if(audio.paused){audio.play().then(()=>{state.playing=true;updatePlayer()}).catch(()=>toast('Playback could not start.'));}else audio.pause()}
async function openArtistByName(name){const q=String(name||'').trim();if(!q)return;toast('Finding artist profile…');try{const d=await fetchJSON(apiUrl(q,'musicArtist',10));const found=(d.results||[]).find(x=>x.artistId&&String(x.artistName||'').toLowerCase()===q.toLowerCase())||(d.results||[]).find(x=>x.artistId);if(found?.artistId)setPage('artist',{id:found.artistId});else{focusSearch();$('#globalSearch').value=q;state.query=q;runSearch(q)}}catch{focusSearch();$('#globalSearch').value=q;state.query=q;runSearch(q)}}
function handleClick(e){const b=e.target.closest('button,[data-open],[data-track-row]');if(!b)return;if(b.dataset.open){const [page,...idParts]=b.dataset.open.split('/');const id=idParts.join('/');if(page==='artist'&&(!id||id==='undefined'||id==='null')){const artistName=(b.dataset.artistName||b.querySelector('.card-title')?.textContent||b.textContent||'').trim();if(artistName)openArtistByName(artistName);else toast('Artist profile is not available for this item.');return}if(page==='artist'&&!/^\d+$/.test(id)){const artistName=(b.dataset.artistName||b.querySelector('.card-title')?.textContent||'').trim();if(artistName){openArtistByName(artistName);return}}setPage(page,id?{id}:{});return}if(b.dataset.play){const t=state.tracks.find(x=>String(x.trackId)===String(b.dataset.play))||state.searchResults.map(itemTrack).find(x=>String(x.trackId)===String(b.dataset.play))||state.history.find(x=>String(x.trackId)===String(b.dataset.play));if(t)playTrack(t);else toast('Track details are not available. Search for it again.');e.stopPropagation();return}if(b.dataset.like){toggleLike(b.dataset.like);e.stopPropagation();return}if(b.dataset.add){const t=state.tracks.find(x=>String(x.trackId)===String(b.dataset.add))||state.history.find(x=>String(x.trackId)===String(b.dataset.add));if(t)openAddModal(t);else toast('Open the track first to add it to a playlist.');e.stopPropagation();return}}
document.addEventListener('click',handleClick);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeExpanded();$('#drawerRoot').innerHTML=''}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();const [page,id]=e.target.dataset.open.split('/');setPage(page,{id})}});
$$('.navitem[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('#brandHome').onclick=()=>setPage('home');$('#menuBtn').onclick=openDrawer;$('#settingsBtn').onclick=()=>setPage('settings');$('#loginBtn').onclick=()=>openAuth('login');$('#accountBtn').onclick=()=>state.user?openModal(`<div class="modal-head"><h2>Guest profile</h2><button class="icon-btn" data-close-modal>×</button></div><p>Signed in locally as <strong>${esc(state.user.name)}</strong>.</p><p class="muted">This is not a secure online account.</p><button class="btn secondary" id="logoutGuest">Clear guest profile</button>`):openAuth('signup');
document.addEventListener('click',e=>{if(e.target.id==='logoutGuest'){state.user=null;persist();$('#accountBtn').textContent='G';closeModal();toast('Guest profile cleared')}})
$('#globalSearch').addEventListener('input',e=>{const q=e.target.value.trim();state.query=q;$('#clearSearch').classList.toggle('hidden',!q);if(state.page!=='search')setPage('search',{push:false});clearTimeout(state.searchTimer);if(!q){state.searchSeq++;if($('#searchContent'))$('#searchContent').innerHTML=renderRecentSearches();return}if($('#searchContent'))$('#searchContent').innerHTML=`<div class="muted">Searching catalog…</div>`;state.searchTimer=setTimeout(()=>runSearch(q),280)});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(state.searchTimer);runSearch($('#globalSearch').value)}if(e.key==='Escape'){$('#globalSearch').value='';state.query='';$('#clearSearch').classList.add('hidden');if($('#searchContent'))$('#searchContent').innerHTML=renderRecentSearches()}});
$('#clearSearch').onclick=()=>{$('#globalSearch').value='';state.query='';$('#clearSearch').classList.add('hidden');$('#globalSearch').focus();if($('#searchContent'))$('#searchContent').innerHTML=renderRecentSearches()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-repeat-search]');if(b){$('#globalSearch').value=b.dataset.repeatSearch;state.query=b.dataset.repeatSearch;setPage('search',{push:false});runSearch(state.query)}});
$('#playBtn').onclick=togglePlayback;$('#prevBtn').onclick=()=>playNext(-1);$('#nextBtn').onclick=()=>playNext(1);$('#shuffleBtn').onclick=()=>{state.shuffle=!state.shuffle;updatePlayer();toast(state.shuffle?'Shuffle on':'Shuffle off')};$('#repeatBtn').onclick=()=>{state.repeat=(state.repeat+1)%3;updatePlayer();toast(['Repeat off','Repeat all','Repeat one'][state.repeat])};$('#progress').oninput=e=>{if(audio.duration){audio.currentTime=audio.duration*Number(e.target.value)/1000;$('#progress').style.setProperty('--fill',`${e.target.value/10}%`)}};$('#volume').oninput=e=>{audio.volume=Number(e.target.value);state.settings.volume=audio.volume;persist();$('#muteBtn').textContent=audio.volume===0?'◖×':'◖))'};$('#muteBtn').onclick=()=>{audio.muted=!audio.muted;$('#muteBtn').textContent=audio.muted?'◖×':'◖))';toast(audio.muted?'Muted':'Sound on')};$('#playerLike').onclick=()=>state.current&&toggleLike(state.current.trackId);$('#queueBtn').onclick=()=>setPage('queue');$('#shareBtn').onclick=()=>state.current?shareUrl(`${state.current.trackName} — ${state.current.artistName}`):shareUrl('Aura Sounds');$('#expandBtn').onclick=openExpanded;$('#playerArt').onclick=openExpanded;
$('#createPlaylistSide').onclick=createPlaylist;$('#themeToggle').onclick=()=>{state.settings.theme=state.settings.theme==='day'?'dark':'day';persist();applyTheme();if($('#themeSetting'))$('#themeSetting').value=state.settings.theme;toast(state.settings.theme==='day'?'Day theme enabled':'Night theme enabled')};$('#auraLyricsPlayerBtn').onclick=()=>window.openAuraLyrics?.();
audio.addEventListener('play',()=>{state.playing=true;updatePlayer()});audio.addEventListener('pause',()=>{state.playing=false;updatePlayer()});audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;$('#currentTime').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration);$('#progress').value=Math.round(audio.currentTime/audio.duration*1000);$('#progress').style.setProperty('--fill',`${$('#progress').value/10}%`);const ep=$('#expandedProgress');if(ep){ep.value=$('#progress').value;$('#expandedCurrent').textContent=fmt(audio.currentTime);$('#expandedDuration').textContent=fmt(audio.duration)}});audio.addEventListener('ended',()=>{if(state.repeat===2){audio.currentTime=0;audio.play();return}playNext(1)});audio.addEventListener('error',()=>{state.playing=false;updatePlayer();if(state.current)toast('Audio source failed to load. Try another track or retry when your connection is stable.')});audio.addEventListener('waiting',()=>toast('Buffering audio preview…'));
window.addEventListener('popstate',e=>{const route=e.state||parseHash();setPage(route.page||'home',{id:route.id,push:false})});
function parseHash(){const p=location.hash.replace(/^#/,'').split('/');return {page:p[0]||'home',id:p[1]?decodeURIComponent(p[1]):null}}
function routeFromHash(){const route=parseHash();if(['home','search','explore','liked','playlists','playlist','recent','queue','artist','album','track','settings'].includes(route.page)){state.query='';setPage(route.page,{id:route.id,push:false})}else setPage('home',{push:false})}
function init(){applyTheme();audio.volume=state.settings.volume;$('#volume').value=state.settings.volume;updatePlayer();if(location.hash)routeFromHash();else renderHome();if(state.user)$('#accountBtn').textContent=(state.user.username||state.user.name||'G')[0].toUpperCase();else{const profile=load('as_profile_v2',null);if(profile)$('#accountBtn').textContent=(profile.username||'G')[0].toUpperCase()}}
init();
})();

<style>

.artist-player-link,.artist-name-link{display:inline-block;padding:0;border:0;background:transparent;color:var(--muted);font:inherit;text-align:left;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist-player-link:hover,.artist-name-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.lyrics-player-btn{color:#c7b4ff!important}
/* Aura Sounds performance + synchronized lyrics upgrade */
:root{scroll-behavior:smooth}img{content-visibility:auto}button,a,input,select{touch-action:manipulation}button{transition:transform .16s ease,opacity .16s ease,background .16s ease}button:active{transform:scale(.97)}:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}.lyrics-fab{position:fixed;right:18px;bottom:104px;z-index:40;border:1px solid #ffffff22;border-radius:999px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;padding:11px 15px;font-weight:700;box-shadow:0 8px 28px #0006;cursor:pointer}.lyrics-panel{position:fixed;inset:0;z-index:100;background:#08070eeF;backdrop-filter:blur(18px);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}.lyrics-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.lyrics-meta{text-align:center;margin:25px auto 8px;max-width:650px}.lyrics-meta h2{font-size:clamp(24px,5vw,42px);margin:8px 0}.lyrics-scroll{width:min(760px,100%);margin:0 auto;flex:1;text-align:center;padding:20px 0 70px}.lyric-line{font-size:clamp(19px,4vw,34px);line-height:1.35;font-weight:750;color:#77738c;padding:10px 8px;transition:color .2s,transform .2s;cursor:pointer}.lyric-line.active{color:#fff;transform:scale(1.025);text-shadow:0 0 28px #a78bfa66}.lyric-line.past{color:#b6add4}.lyrics-status{color:#b9b1d1;text-align:center;padding:18px}.key-box{border:1px solid #ffffff1a;background:#ffffff08;border-radius:14px;padding:14px;word-break:break-all;font-family:monospace;letter-spacing:.04em}.key-warning{font-size:12px;color:#fbbf24;line-height:1.5}.auth-actions{display:flex;gap:8px;flex-wrap:wrap}.auth-actions>*{flex:1}@media(max-width:600px){.lyrics-fab{bottom:94px;right:10px;padding:9px 12px}.lyrics-panel{padding-left:14px;padding-right:14px}.lyric-line{padding:8px 2px}}

<button class="lyrics-fab" id="auraLyricsBtn" type="button" aria-label="Open synchronized lyrics">♫ Lyrics</button>
<div id="auraLyricsRoot" hidden></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), audio=$('#audio');
const LYRIC_API='https://lrclib.net/api';let lyricTrackKey='',lyricLines=[],lyricFetchSeq=0,lastActive=-1;
const escText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function currentMeta(){return {title:$('#playerTitle')?.textContent?.trim()||'',artist:$('#playerArtist')?.textContent?.trim()||''}}
function openLyrics(){const root=$('#auraLyricsRoot'),m=currentMeta();root.hidden=false;root.innerHTML=`<section class="lyrics-panel" role="dialog" aria-modal="true" aria-label="Synchronized lyrics"><div class="lyrics-top"><button class="control" id="auraLyricsClose" aria-label="Close lyrics">✕</button><span class="eyebrow">AURA SOUNDS · LYRICS</span><button class="control" id="auraLyricsRetry" aria-label="Retry lyrics search">↻</button></div><div class="lyrics-meta"><div class="eyebrow">NOW PLAYING</div><h2>${escText(m.title)}</h2><p class="muted"><button class="artist-name-link" id="lyricsArtistLink" type="button">${escText(m.artist)}</button></p></div><div class="lyrics-scroll" id="auraLyricsScroll"><div class="lyrics-status" id="auraLyricsStatus">Looking for timed lyrics…</div></div><div class="lyrics-status" id="auraLyricsFoot">Timed lyrics appear only when a matching licensed lyrics record is available.</div></section>`;$('#auraLyricsClose').onclick=closeLyrics;$('#auraLyricsRetry').onclick=()=>loadLyrics(true);$('#lyricsArtistLink')?.addEventListener('click',()=>{const t=state.current;if(t?.artistId){closeLyrics();setPage('artist',{id:t.artistId})}else toast('Artist profile is not available for this track yet.')});loadLyrics();}
window.openAuraLyrics=openLyrics;
function closeLyrics(){$('#auraLyricsRoot').hidden=true}
function renderLyrics(lines,status){const box=$('#auraLyricsScroll');if(!box)return;if(!lines?.length){box.innerHTML=`<div class="lyrics-status">${escText(status||'No synchronized lyrics were found for this track.')}</div>`;return}lyricLines=lines;lastActive=-1;box.innerHTML=lines.map((l,i)=>`<div class="lyric-line" data-lyric-index="${i}" tabindex="0" role="button" aria-label="Seek to lyric line ${i+1}">${escText(l.text)||'♪'}</div>`).join('');box.querySelectorAll('[data-lyric-index]').forEach(el=>{const seek=()=>{const line=lyricLines[Number(el.dataset.lyricIndex)];if(line&&audio&&Number.isFinite(line.time)&&audio.duration)audio.currentTime=Math.min(line.time,audio.duration)};el.onclick=seek;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();seek()}}});syncLyricLine()}
async function loadLyrics(force=false){const m=currentMeta(),key=(m.artist+'|'+m.title).toLowerCase();if(!m.title||m.title==='Choose a song to begin'){renderLyrics([], 'Choose a track first, then open Lyrics.');return}if(!force&&key===lyricTrackKey&&lyricLines.length){renderLyrics(lyricLines);return}lyricTrackKey=key;const seq=++lyricFetchSeq;renderLyrics([], 'Searching for synchronized lyrics…');try{const url=LYRIC_API+'/search?track_name='+encodeURIComponent(m.title)+'&artist_name='+encodeURIComponent(m.artist);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);const res=await fetch(url,{signal:controller.signal,headers:{'Accept':'application/json'}});clearTimeout(timer);if(!res.ok)throw new Error(res.status===429?'Lyrics service is busy. Try again shortly.':'Lyrics are temporarily unavailable.');const list=await res.json();if(seq!==lyricFetchSeq)return;const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();const exact=list.find(x=>norm(x.trackName)===norm(m.title)&&(!x.artistName||norm(x.artistName)===norm(m.artist)))||list.find(x=>norm(x.trackName)===norm(m.title))||list[0];if(!exact){renderLyrics([], 'No synchronized lyrics were found for this track.');return}if(exact.syncedLyrics){const parsed=exact.syncedLyrics.split(/\r?\n/).map(line=>{const mt=line.match(/^\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]\s*(.*)$/);if(!mt)return null;const frac=mt[3]?Number('0.'+mt[3]):0;return {time:Number(mt[1])*60+Number(mt[2])+frac,text:mt[4]||'♪'}}).filter(Boolean);if(parsed.length){renderLyrics(parsed);return}}if(exact.plainLyrics){renderLyrics(exact.plainLyrics.split(/\r?\n/).filter(Boolean).map(text=>({time:0,text})), 'Plain lyrics available — timed synchronization is not available for this track.');return}renderLyrics([], 'No usable lyrics were supplied for this track.')}catch(e){if(seq!==lyricFetchSeq)return;renderLyrics([],e.name==='AbortError'?'Lyrics request timed out. Please try again.':(e.message||'Could not load lyrics. Check your connection.'))}}

musicUnsub=onValue(ref(db,'rooms/'+code+'/music'),async snap=>{const m=snap.val();if(!m||m.by===uid||m.stamp===lastRemoteStamp)return;lastRemoteStamp=m.stamp;applyingRemote=true;try{if(m.src&&audio.src!==m.src){audio.src=m.src;await new Promise(resolve=>{audio.addEventListener('loadedmetadata',resolve,{once:true});setTimeout(resolve,2200)});$('#playerTitle').textContent=m.title||'Partner is playing';$('#playerArtist').textContent=m.artist||'Aura Together';if(m.art){const pa=$('#playerArt');if(pa&&pa.src!==m.art)pa.src=m.art;}}if(Number.isFinite(m.time)&&audio.readyState>=1&&Math.abs(audio.currentTime-m.time)>3)audio.currentTime=m.time;if(m.paused||m.action==='pause')audio.pause();else if(m.action==='play'||m.action==='seek'||m.action==='time'){try{await audio.play()}catch{notify('Tap Play once on this device to allow synced playback.')}}}catch(e){console.warn('Aura Together sync:',e)}finally{setTimeout(()=>applyingRemote=false,300)}});
msgUnsub=window.AuraChat?window.AuraChat.open(code,uid):onValue(ref(db,'rooms/'+code+'/messages'),snap=>{const chat=$('#togetherChat');if(!chat)return;const list=[];snap.forEach(child=>list.push({id:child.key,...child.val()}));chat.innerHTML=list.slice(-100).map(m=>`<div class="together-msg ${m.from===uid?'mine':''}"><strong>${esc(m.name||'Partner')}</strong><div>${esc(m.text)}</div><small>${m.from===uid?'You':'Partner'}</small></div>`).join('');chat.scrollTop=chat.scrollHeight;});
$('#togetherCopyKey').onclick=async()=>{try{await navigator.clipboard.writeText(code);notify('Partner key copied. Send it privately.')}catch{notify('Your partner key is '+code)}};
$('#togetherSendForm').onsubmit=async e=>{e.preventDefault();const input=$('#togetherMessage');const text=input.value.trim();if(!text||!db)return;input.value='';try{await push(ref(db,'rooms/'+code+'/messages'),{from:uid,name:localStorage.getItem('as_demo_key_user_v1')||'Listener',text,at:serverTimestamp()})}catch{notify('Message did not send. Check your connection.')}};
$('#togetherUnpair').onclick=()=>{if(roomUnsub)roomUnsub();if(msgUnsub)msgUnsub();roomCode='';roomData=null;localStorage.removeItem('aura_together_room');$('#togetherLive').hidden=true;$('#togetherSetup').hidden=false;renderSetup();};
}
async function sendMusic(action){if(!db||!uid||!roomCode||applyingRemote||!roomData)return;const paired=roomData.partner&&roomData.partner!==roomData.owner;if(!paired)return;const now=Date.now();if(action==='time'&&now-lastSentAt<1800)return;lastSentAt=now;try{await set(ref(db,'rooms/'+roomCode+'/music'),{by:uid,action,art:(()=>{const x=$('#playerArt')?.src||'';return /^https?:/.test(x)?x:''})(),src:audio.currentSrc||audio.src||'',title:$('#playerTitle')?.textContent||'',artist:$('#playerArtist')?.textContent||'',time:audio.currentTime||0,paused:audio.paused,stamp:now})}catch{}}
function subscribeMusic(){ if(roomCode && db) connectRoom(roomCode); }
// Expose local feature state updates without changing the original player implementation.
audio?.addEventListener('play',()=>sendMusic('play'));audio?.addEventListener('pause',()=>sendMusic('pause'));audio?.addEventListener('seeked',()=>sendMusic('seek'));audio?.addEventListener('timeupdate',()=>sendMusic('time'));
const originalOpen=window.openAuraTogether;window.openAuraTogether=openTogether;
function addButton(){const actions=$('.top-actions');if(actions&&!$('#togetherBtn')){const b=document.createElement('button');b.id='togetherBtn';b.className='icon-btn';b.type='button';b.title='Aura Together — partner & messages';b.setAttribute('aria-label','Open partner key and messages');b.textContent='💔';b.onclick=()=>window.openAuraTogether();actions.prepend(b)}
const settingsPage=$('#page');if(settingsPage&&!$('#settingsTogetherBtn')){const rows=settingsPage.querySelectorAll('.setting-row');if(rows.length){const row=document.createElement('div');row.className='setting-row';row.style.display='block';row.style.gridColumn='1 / -1';row.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><strong>💬 Partner messages</strong><div class="tiny muted">Enter your partner’s 6-character AURA TOGETHER key to send a message to their paired room.</div></div><button class="btn secondary small" id="settingsTogetherBtn" type="button">Open Together</button></div><form id="settingsPartnerMessageForm" style="display:grid;gap:8px;margin-top:12px"><input id="settingsPartnerKey" maxlength="6" autocomplete="off" placeholder="Partner Together key (6 characters)" aria-label="Partner Together key" required style="width:100%;min-width:0;text-transform:uppercase;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px"><textarea id="settingsPartnerMessage" maxlength="500" rows="3" placeholder="Write a message for your partner…" aria-label="Message to partner" required style="width:100%;min-width:0;resize:vertical;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit"></textarea><button class="btn primary" id="settingsPartnerSend" type="submit">Send message to partner</button><p class="tiny muted" id="settingsPartnerStatus" aria-live="polite">Note: this uses the AURA TOGETHER room key, not the local Aura login/access key.</p></form>';rows[0].parentNode.insertBefore(row,rows[0]);$('#settingsTogetherBtn').onclick=openTogether;$('#settingsPartnerKey').value=localStorage.getItem('aura_together_partner_key')||'';$('#settingsPartnerKey').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);localStorage.setItem('aura_together_partner_key',e.target.value)});$('#settingsPartnerMessageForm').onsubmit=async e=>{e.preventDefault();const key=$('#settingsPartnerKey').value.trim().toUpperCase();const input=$('#settingsPartnerMessage');const message=input.value.trim();const status=$('#settingsPartnerStatus');const send=$('#settingsPartnerSend');if(key.length!==6){status.textContent='Enter the 6-character Together key.';return}if(!message){status.textContent='Write a message first.';return}if(!await ready()){status.textContent='Firebase is not connected. Check Firebase Anonymous Authentication and Realtime Database rules.';return}send.disabled=true;send.textContent='Sending…';status.textContent='Sending message…';try{await push(ref(db,'rooms/'+key+'/messages'),{from:uid,name:localStorage.getItem('as_demo_key_user_v1')||localStorage.getItem('as_profile_v2')&&JSON.parse(localStorage.getItem('as_profile_v2')).username||'Listener',text:message,at:serverTimestamp()});input.value='';status.textContent='Message sent to the Together room. Your partner can see it in AURA TOGETHER Messages.';toast('Partner message sent.')}catch(err){status.textContent='Message failed. Check that the key is correct and Firebase database rules allow messages.'}finally{send.disabled=false;send.textContent='Send message to partner'}};}}}
new MutationObserver(addButton).observe(document.body,{childList:true,subtree:true});addButton();
// Reconnect stored room after configuration has been completed and the user opens the feature.
const oldOpenTogether=openTogether;window.openAuraTogether=async()=>{oldOpenTogether();if(configReady&&roomCode&&await ready())connectRoom(roomCode)};
</script>


<!-- ===== Aura Sounds v2 add-on: accounts, taste-based discovery, gestures, name effects ===== -->
<style>
#player,.expanded-art{touch-action:none;-webkit-user-select:none;user-select:none}
#auraFx{position:fixed;inset:0;z-index:99999;pointer-events:none;overflow:hidden}
#auraFx canvas{position:absolute;inset:0}
@keyframes auraShock{0%,100%{transform:none}12%{transform:translate(-7px,4px)}25%{transform:translate(8px,-5px)}38%{transform:translate(-5px,-6px)}52%{transform:translate(6px,5px)}70%{transform:translate(-3px,2px)}}
.aura-shock{animation:auraShock .22s linear infinite}
#auraMovie{position:fixed;inset:0;z-index:99999;background:#050310;display:grid;place-items:center;animation:mvIn .5s ease}
@keyframes mvIn{from{opacity:0}}
#auraMovie .mvf{position:relative;height:min(100vh,177.78vw);height:min(100dvh,177.78vw);aspect-ratio:9/16;overflow:hidden;box-shadow:0 0 90px #000}
#auraMovie svg{position:absolute;inset:0;width:100%;height:100%}
.mvtw{animation:mvTw 2.2s ease-in-out infinite alternate}@keyframes mvTw{from{opacity:.2}to{opacity:1}}
.mvfl{stroke-dasharray:16 24;animation:mvFl .7s linear infinite}@keyframes mvFl{to{stroke-dashoffset:-40}}
.mvfade{position:absolute;inset:0;background:#000;pointer-events:none}
.mvx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:20px;cursor:pointer;z-index:2}
.aura-keybox{font-family:ui-monospace,monospace;font-size:18px;letter-spacing:.06em;text-align:center;padding:14px;border-radius:12px;background:#ffffff10;border:1px dashed var(--accent);margin:12px 0;word-break:break-all;user-select:all}
</style>
<script>
(()=>{'use strict';window.__auraFx=true;
const $=s=>document.querySelector(s),LS=localStorage;
const jget=(k,d)=>{try{const v=LS.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const jset=(k,v)=>{try{LS.setItem(k,JSON.stringify(v))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)};

/* ---------- Accounts (stored on this device; key is stored only as a hash) ---------- */
const USERS='aura_users_v2',SESS='aura_session_v2';
const users=()=>jget(USERS,{});
const session=()=>LS.getItem(SESS)||'';
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return'f'+(h>>>0).toString(16)}}
function genKey(){const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(12);crypto.getRandomValues(a);const s=[...a].map(n=>cs[n%cs.length]).join('');return`AURA-${s.slice(0,4)}-${s.slice(4,8)}-${s.slice(8)}`}
const closeM=()=>{const r=$('#auraAuth');if(r)r.innerHTML=''};
function modal(html){let r=$('#auraAuth');if(!r){r=document.createElement('div');r.id='auraAuth';document.body.appendChild(r)}
 r.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" style="max-height:90vh;overflow:auto">${html}</div></div>`;
 r.firstChild.addEventListener('click',e=>{if(e.target===r.firstChild)closeM()});r.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeM);return r}
const head=t=>`<div class="modal-head"><h2>${t}</h2><button class="icon-btn" data-x aria-label="Close">×</button></div>`;
const grid2='display:grid;grid-template-columns:1fr 1fr;gap:10px';
const errBox='<div id="auErr" role="alert" style="color:var(--danger);min-height:20px;font-size:13px;margin:4px 0"></div>';
function signupUI(){
 let a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);const op=Math.random()<.5?'+':'−';if(op==='−'&&a<b)[a,b]=[b,a];const ans=op==='+'?a+b:a-b;
 const r=modal(head('Create account')+`<form id="auSign" novalidate>
 <div style="${grid2}"><div class="field"><label for="auF">First name</label><input id="auF" maxlength="30" autocomplete="given-name"></div><div class="field"><label for="auL">Last name</label><input id="auL" maxlength="30" autocomplete="family-name"></div></div>
 <div style="${grid2}"><div class="field"><label for="auA">Age</label><input id="auA" type="number" inputmode="numeric" min="10" max="100"></div><div class="field"><label for="auC">Country</label><input id="auC" maxlength="60" autocomplete="country-name"></div></div>
 <div class="field"><label for="auU">Username</label><input id="auU" maxlength="20" autocapitalize="none" autocomplete="username" placeholder="a-z 0-9 _ ."></div>
 <div class="field"><label for="auFav">Favorite artist</label><input id="auFav" maxlength="60" placeholder="e.g. The Weeknd"></div>
 <div class="field"><label for="auM">Verify: ${a} ${op} ${b} = ?</label><input id="auM" type="number" inputmode="numeric"></div>
 ${errBox}<button class="btn primary" type="submit" style="width:100%">Create account</button>
 <button class="btn secondary" type="button" id="auSw" style="width:100%;margin-top:8px">I already have a key</button></form>`);
 $('#auSw').onclick=loginUI;
 $('#auSign').onsubmit=async e=>{e.preventDefault();const v=id=>$(id).value.trim(),err=m=>{$('#auErr').textContent=m};
  const f=v('#auF'),l=v('#auL'),age=+v('#auA'),c=v('#auC'),u=v('#auU').toLowerCase(),fav=v('#auFav');
  if(!f||!l)return err('Enter first and last name.');
  if(!Number.isInteger(age)||age<10||age>100)return err('Enter a valid age (10–100).');
  if(!c)return err('Enter your country.');
  if(!/^[a-z0-9_.]{3,20}$/.test(u))return err('Username: 3–20 chars, a-z 0-9 _ .');
  if(users()[u])return err('That username is taken.');
  if(!fav)return err('Enter your favorite artist.');
  if(v('#auM')===''||+v('#auM')!==ans)return err('Math check is wrong. Try again.');
  const key=genKey(),all=users();all[u]={first:f,last:l,age,country:c,username:u,fav,h:await hash(u+':'+key),at:Date.now()};jset(USERS,all);
  LS.setItem(SESS,u);bump(fav,'',6);syncUI();
  modal(head('Account created ✓')+`<p class="muted">Your access key is shown <strong>only once</strong>. Save it — you need it with your username to log in.</p><div class="aura-keybox" id="auKey">${key}</div><button class="btn secondary" id="auCopy" style="width:100%">Copy key</button><button class="btn primary" id="auGo" style="width:100%;margin-top:8px">Start listening</button>`);
  $('#auCopy').onclick=async()=>{try{await navigator.clipboard.writeText(key);toast('Key copied')}catch{const s=getSelection(),rg=document.createRange();rg.selectNodeContents($('#auKey'));s.removeAllRanges();s.addRange(rg);toast('Key selected — copy it')}};
  $('#auGo').onclick=()=>{closeM();toast(`Welcome, ${f}!`);if(typeof location!=='undefined'&&/explore/.test(location.hash+location.search))forYou()}}}
let fails=0,lockUntil=0;
function loginUI(){
 modal(head('Log in')+`<form id="auLog" novalidate><div class="field"><label for="auU2">Username</label><input id="auU2" autocapitalize="none" autocomplete="username"></div><div class="field"><label for="auK">Access key</label><input id="auK" autocomplete="off" autocapitalize="characters" placeholder="AURA-XXXX-XXXX-XXXX"></div>${errBox}<button class="btn primary" type="submit" style="width:100%">Log in</button><button class="btn secondary" type="button" id="auSw2" style="width:100%;margin-top:8px">Create account</button></form>`);
 $('#auSw2').onclick=signupUI;
 $('#auLog').onsubmit=async e=>{e.preventDefault();const err=m=>{$('#auErr').textContent=m};
  if(Date.now()<lockUntil)return err('Too many attempts. Wait a few seconds.');
  const u=$('#auU2').value.trim().toLowerCase(),k=$('#auK').value.trim().toUpperCase(),rec=users()[u];
  if(!rec||rec.h!==await hash(u+':'+k)){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return err('Wrong username or key.')}
  fails=0;LS.setItem(SESS,u);syncUI();closeM();toast(`Welcome back, ${rec.first}!`)}}
function profileUI(){const u=session(),rec=users()[u];if(!rec){LS.removeItem(SESS);syncUI();return signupUI()}
 const top=topArtists(5).map(x=>esc(x[0])).join(', ')||'Play some songs to build your taste';
 modal(head(esc(rec.first+' '+rec.last))+`<p class="muted">@${esc(rec.username)} · ${esc(rec.country)} · ${rec.age} yrs</p><p><strong>Favorite:</strong> ${esc(rec.fav)}</p><p><strong>Your top artists:</strong> <span class="muted">${top}</span></p><button class="btn secondary" id="auOut" style="width:100%">Log out</button>`);
 $('#auOut').onclick=()=>{LS.removeItem(SESS);syncUI();closeM();toast('Logged out')}}
let loginLabel=null;
function syncUI(){const u=session(),rec=users()[u],ab=$('#accountBtn'),lb=$('#loginBtn');
 if(ab){ab.textContent=rec?rec.first[0].toUpperCase():'G';ab.onclick=()=>session()&&users()[session()]?profileUI():signupUI()}
 if(lb){if(loginLabel===null)loginLabel=lb.textContent;lb.textContent=rec?'Log out':loginLabel;lb.onclick=()=>{if(session()){LS.removeItem(SESS);syncUI();toast('Logged out')}else loginUI()}}}

/* ---------- Taste engine ---------- */
const tkey=()=>'aura_taste_v2_'+(session()||'guest');
const taste=()=>jget(tkey(),{a:{},g:{}});
function bump(artist,genre,w){artist=String(artist||'').trim().toLowerCase();if(!artist)return;const t=taste();
 for(const k in t.a)t.a[k]*=.985;for(const k in t.g)t.g[k]*=.985;
 t.a[artist]=(t.a[artist]||0)+w;if(genre){const g=String(genre).trim();t.g[g]=(t.g[g]||0)+Math.ceil(w/2)}
 const trim=o=>Object.fromEntries(Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,60));t.a=trim(t.a);t.g=trim(t.g);jset(tkey(),t)}
const topArtists=n=>Object.entries(taste().a).sort((x,y)=>y[1]-x[1]).slice(0,n);
const topGenres=n=>Object.entries(taste().g).sort((x,y)=>y[1]-x[1]).slice(0,n).map(x=>x[0]);
const audio=$('#audio');let counted='';
if(audio)audio.addEventListener('timeupdate',()=>{const src=audio.currentSrc;if(!src||audio.currentTime<12||counted===src)return;counted=src;
 const title=($('#playerTitle')?.textContent||'').trim(),artist=($('#playerArtist')?.textContent||'').trim();
 const h=jget('as_history',[]).find(x=>x&&x.trackName===title);bump(h?.artistName||artist,h?.primaryGenreName,3)},{passive:true});
$('#playerLike')?.addEventListener('click',()=>setTimeout(()=>{if(($('#playerLike').textContent||'').includes('♥'))bump(($('#playerArtist')?.textContent||''),'',4)},60));
document.addEventListener('click',e=>{const c=e.target.closest('[data-open^="artist/"]');const n=c?.querySelector?.('.card-title')?.textContent;if(n)bump(n,'',1)},true);

/* ---------- Discovery: re-rank cards + "Made for you" ---------- */
function rank(){const host=$('#discoverArtists');if(!host)return;const t=taste();if(!Object.keys(t.a).length)return;
 const cards=[...host.children].filter(c=>c.classList.contains('card'));if(cards.length<2)return;
 const sc=c=>t.a[(c.querySelector('.card-title')?.textContent||'').trim().toLowerCase()]||0;
 const sorted=cards.map((c,i)=>[c,i]).sort((x,y)=>sc(y[0])-sc(x[0])||x[1]-y[1]).map(x=>x[0]);
 if(sorted.every((c,i)=>c===cards[i]))return;const f=document.createDocumentFragment();sorted.forEach(c=>f.appendChild(c));host.appendChild(f)}
const memo=new Map();
async function itunes(term,extra=''){const k=term+extra;if(memo.has(k))return memo.get(k);const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);
 try{const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=song&limit=30${extra}`,{signal:ac.signal});if(!r.ok)throw 0;const j=(await r.json()).results||[];memo.set(k,j);return j}catch{return[]}finally{clearTimeout(tm)}}
const acard=a=>`<article class="card" tabindex="0" role="link" data-open="artist/${a.id}" aria-label="Open ${esc(a.name)}"><div class="artwrap"><img src="${esc(a.img)}" alt="${esc(a.name)} artwork" loading="lazy" onerror="this.onerror=null;this.style.opacity=.25"></div><div class="card-title">${esc(a.name)}</div><div class="card-sub">${esc(a.sub||'Artist')}</div></article>`;
const toA=s=>({id:s.artistId,name:s.artistName,img:String(s.artworkUrl100||'').replace(/100x100bb/,'400x400bb')});
async function forYou(){const hero=$('.discover-hero');if(!hero||$('#auraForYou'))return;const top=topArtists(6);if(!top.length)return;
 const sec=document.createElement('div');sec.id='auraForYou';hero.after(sec);
 const heardNames=new Set(Object.keys(taste().a));
 const [mine,...pools]=await Promise.all([Promise.all(top.slice(0,4).map(([n])=>itunes(n,'&attribute=artistTerm').then(r=>r.find(s=>s.artistId&&(s.artistName||'').toLowerCase()===n)||r.find(s=>s.artistId)))),...topGenres(2).map(g=>itunes(g+' music'))]);
 if(!sec.isConnected)return;const seen=new Set(),mineA=[];
 for(const s of mine){if(s&&!seen.has(s.artistId)){seen.add(s.artistId);mineA.push({...toA(s),sub:'Your artist'})}}
 const rec=[];for(const s of pools.flat()){if(!s.artistId||seen.has(s.artistId)||heardNames.has((s.artistName||'').toLowerCase()))continue;seen.add(s.artistId);rec.push({...toA(s),sub:'You may like'});if(rec.length>=8)break}
 const block=(t,p,l)=>l.length?`<section class="section"><div class="section-head"><div><h2>${t}</h2><p>${p}</p></div></div><div class="cards">${l.map(acard).join('')}</div></section>`:'';
 sec.innerHTML=block('Made for you','From the artists you actually listen to',mineA)+block('You may also like','Similar sound to your taste',rec)}
let raf=0;new MutationObserver(()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;rank();forYou()})}).observe($('#page')||document.body,{childList:true,subtree:true});

/* ---------- Player gestures: swipe ◀ ▶, tap play/pause, swipe down closes ---------- */
let zone=null,sx=0,sy=0,st=0;
document.addEventListener('pointerdown',e=>{const z=e.target.closest('#player,.expanded-art');if(!z||e.target.closest('button,input,a,select,label')){zone=null;return}zone=z;sx=e.clientX;sy=e.clientY;st=Date.now()},{passive:true});
document.addEventListener('pointercancel',()=>{zone=null},{passive:true});
document.addEventListener('pointerup',e=>{if(!zone)return;const z=zone;zone=null;const dx=e.clientX-sx,dy=e.clientY-sy,dt=Date.now()-st,ex=z.classList.contains('expanded-art');
 if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<800){const b=$(dx<0?(ex?'#expandedNext':'#nextBtn'):(ex?'#expandedPrev':'#prevBtn'));if(b)b.click();z.animate?.([{transform:`translateX(${dx<0?-34:34}px)`,opacity:.55},{transform:'none',opacity:1}],{duration:240,easing:'ease-out'});navigator.vibrate?.(12);return}
 if(ex&&dy>90&&Math.abs(dy)>Math.abs(dx)*1.4){$('#expandedClose')?.click();return}

.lt-full{margin:8px auto 0;padding:11px 22px;border-radius:999px;border:1px solid var(--lt-line);background:var(--lt-btn);color:var(--lt-btnfg);font-weight:700;font-size:14px;cursor:pointer;align-self:center}
.yt-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(92vw,520px);aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0008}.yt-box iframe{width:100%;height:100%;border:0}
.yt-x{position:absolute;right:8px;top:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px;cursor:pointer}

</style>
<script type="module">
/* Settings "Messages" button + official full-song player (YouTube embed, needs your own free YouTube Data API key). */
const $=s=>document.querySelector(s),LS=localStorage,audio=$('#audio');
const mk=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const say=m=>{const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>t.classList.remove('show'),3200)};
const logged=()=>{try{return !!JSON.parse(LS.getItem('lt_session'))}catch{return false}};
function settingsBtn(){const p=$('#page'),h=p?.querySelector('h1.page-title');if(!h||!/^settings$/i.test(h.textContent.trim())||$('#settingsMsgRow'))return;const first=p.querySelector('.setting-row');if(!first)return;
const r=mk('div','setting-row');r.id='settingsMsgRow';r.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;grid-column:1 / -1';
r.innerHTML='<div><strong>💬 Messages</strong><div class="tiny muted">Open your private chat with your partner.</div></div><button class="btn primary" id="settingsMsgBtn" type="button">Open chat</button>';first.before(r);$('#settingsMsgBtn').onclick=()=>window.openAuraTogether?.()}
/* official full song: YouTube IFrame player (visible, as YouTube's terms require) */
let ytApi=null;const loadYT=()=>ytApi||(ytApi=new Promise(res=>{if(window.YT?.Player)return res();window.onYouTubeIframeAPIReady=res;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s)}));
async function playFull(np){const title=$('#playerTitle')?.textContent.trim(),artist=$('#playerArtist')?.textContent.trim();if(!title)return;
let key=LS.getItem('lt_yt_key')||'';if(!key){key=(prompt('Paste your YouTube Data API v3 key (free from Google Cloud Console). Saved on this device only:')||'').trim();if(!key)return;LS.setItem('lt_yt_key',key)}
say('Finding the full song…');try{const q=encodeURIComponent((title+' '+artist.split(/,|&|feat\.?/i)[0]+' official audio').trim()),r=await(await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&videoCategoryId=10&maxResults=1&q=${q}&key=${encodeURIComponent(key)}`)).json();
if(r.error){if(/key|API_KEY/i.test(r.error.message||''))LS.removeItem('lt_yt_key');return say('YouTube: '+(r.error.message||'request failed'))}const id=r.items?.[0]?.id?.videoId;if(!id)return say('No full version found for this song.');
audio.pause();$('#ytBox')?.remove();const box=mk('div','yt-box');box.id='ytBox';box.innerHTML='<button class="yt-x" aria-label="Close player">×</button><div id="ytp"></div>';np.append(box);
let pl;box.querySelector('.yt-x').onclick=()=>{try{pl?.destroy()}catch{}box.remove()};await loadYT();pl=new YT.Player('ytp',{videoId:id,width:'100%',height:'100%',playerVars:{autoplay:1,playsinline:1,rel:0},events:{onReady:e=>e.target.playVideo()}})}catch{say('Could not reach YouTube. Check your connection.')}}
function npBtn(){const np=$('#np3d');if(!np||!np.dataset.lt||np.querySelector('.lt-full'))return;const b=mk('button','lt-full');b.type='button';const g=logged();b.textContent=g?'▶ Play full song':'🔒 Full song — sign up';b.onclick=()=>{if(g)playFull(np);else{$('#npClose')?.click();window.AuraUI?.signup?.()}};($('#ltTime')||np.querySelector('.np-stage')).after(b)}
new MutationObserver(()=>{settingsBtn();npBtn()}).observe(document.body,{childList:true,subtree:true});settingsBtn();

</script>
</body>
</html>
