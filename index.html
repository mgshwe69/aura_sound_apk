/* AURA SOUNDS — cinematic artist experience refresh */
.artist-cinematic{position:relative;min-height:calc(100svh - 78px);margin:-24px calc(clamp(14px,3vw,38px) * -1) 34px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,3vw,38px);background:#09070f;border-bottom:1px solid #ffffff18}
.artist-cinematic .artist-bg{position:absolute;inset:-9%;z-index:-3;background-size:cover;background-position:center 30%;will-change:transform;pointer-events:none}
.artist-cinematic .artist-bg-back{filter:blur(1.5px) saturate(.9);opacity:.5;transform:scale(1.16)}
.artist-cinematic .artist-bg-front{opacity:.38;mix-blend-mode:screen;mask-image:linear-gradient(90deg,black,transparent 92%);transform:scale(1.06)}
.artist-vignette{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#08070ff2 0%,#0b0816c9 42%,#0b081655 100%),linear-gradient(0deg,#09070f 0%,transparent 38%,#09070f55 100%);pointer-events:none}
.artist-cinematic-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.artist-cinematic-copy{width:min(880px,100%);padding:clamp(38px,8vh,100px) 0 22px;animation:artistRise .75s cubic-bezier(.2,.75,.2,1) both}
.artist-cinematic-copy h1{font-size:clamp(48px,9vw,112px);letter-spacing:-.065em;line-height:.94;max-width:1000px;margin:20px 0 18px;text-wrap:balance;text-shadow:0 8px 44px #0008}
.artist-tagline{max-width:620px;font-size:clamp(16px,2vw,21px);color:#e6def4;margin:0 0 12px}
.artist-facts{display:flex;flex-wrap:wrap;gap:9px;align-items:center;color:#c9c1db;font-size:13px;margin:0 0 24px}.artist-facts span{color:#a78bfa}
.artist-pulse{width:8px;height:8px;border-radius:50%;background:#c4b5fd;box-shadow:0 0 18px #a78bfa;display:inline-block}
.artist-hero-credit{font-size:12px;color:#d5cde3;margin-top:30px}.artist-hero-credit strong{color:#fff}
.artist-scroll-cue{display:flex;align-items:center;gap:10px;margin-top:clamp(22px,5vh,54px);font-size:10px;letter-spacing:2px;color:#bcb4d0}.artist-scroll-cue span{height:34px;width:1px;background:linear-gradient(#c4b5fd,transparent);display:inline-block;animation:cuePulse 1.8s ease-in-out infinite}
.artist-content-section{animation:artistRise .5s ease both}.artist-about{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#201630,#101019);margin-top:35px}.artist-about h2{font-size:clamp(26px,4vw,42px);margin:8px 0}.artist-about p{color:var(--muted)}
@keyframes artistRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes cuePulse{0%,100%{opacity:.45;transform:scaleY(.8);transform-origin:top}50%{opacity:1;transform:scaleY(1);transform-origin:top}}

// 🔥 YAHAN CHANGE KIYA GAYA HAI (JioSaavn Source Integration) 🔥
async function playTrack(track){
    const t=itemTrack(track);
    if(!t.trackId){toast('This track is not available in the catalog.');return}
    state.tracks=uniqueTracks([t,...state.tracks]);
    
    if(!state.queue.some(x=>String(x.trackId)===String(t.trackId))){
        state.queue.push(t)
    }
    state.queueIndex=state.queue.findIndex(x=>String(x.trackId)===String(t.trackId));
    state.current=t;
    updatePlayer();
    
    // Show loading state while fetching from Saavn
    toast('Loading full track...');

    try {
        const query = `${t.trackName} ${t.artistName}`;
        const res = await fetch(`https://saavnapi-nine.vercel.app/result?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        let audioUrl = t.previewUrl; // Default fallback to 30s preview
        
        // Agar JioSaavn pe mil gaya toh full song URL use karo
        if (data && data.length > 0 && data[0].media_url) {
            audioUrl = data[0].media_url;
        }

        if (!audioUrl) {
            toast('No playable audio found for this track.');
            return;
        }

        audio.src = audioUrl;
        audio.load();
        audio.play().then(()=>{
            state.playing=true;
            updatePlayer();
            addHistory(t);
        }).catch(()=>{
            state.playing=false;
            updatePlayer();
            toast('Playback was blocked or unavailable. Tap Play to try again.');
        });
    } catch(err) {
        console.error("Saavn Error:", err);
        // Fallback if API fails
        if(t.previewUrl) {
            audio.src = t.previewUrl;
            audio.load();
            audio.play().then(()=>{ state.playing=true; updatePlayer(); addHistory(t); });
        } else {
            toast('Failed to load audio.');
        }
    }
}
// 🔥 END OF CHANGE 🔥

function playList(list,shuffle=false){const tracks=uniqueTracks(list||[]);if(!tracks.length){toast('No tracks available to play yet.');return}state.queue=shuffle?tracks.slice().sort(()=>Math.random()-.5):tracks;state.queueIndex=-1;playNext(1)}

#togetherBtn{border:1px solid #ff86bc55;background:linear-gradient(145deg,#3a1738,#21152f);color:#ffd8eb;box-shadow:0 0 18px #ff4d9d20;animation:heartGlow 2.8s ease-in-out infinite}
@keyframes heartGlow{0%,100%{box-shadow:0 0 10px #ff4d9d20}50%{box-shadow:0 0 23px #ff4d9d66,0 0 42px #8c5bff22}}
.together-modal{width:min(620px,100%);max-height:min(86vh,820px);overflow:auto}.together-hero{text-align:center;padding:12px 6px 20px}.together-heart{font-size:54px;filter:drop-shadow(0 0 18px #ff5baf);animation:heartBeat 1.4s ease-in-out infinite}.together-glow{color:#ffd0e8;text-shadow:0 0 8px #ff53ad,0 0 20px #ff53ad99,0 0 36px #a78bfa77;font-weight:850}.together-status{padding:10px 13px;border-radius:12px;background:#a78bfa14;border:1px solid #a78bfa33;font-size:13px;margin:12px 0}.together-chat{height:240px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px;background:#08081088;border:1px solid #ffffff14;border-radius:14px}.together-msg{max-width:85%;padding:9px 12px;border-radius:14px;background:#ffffff12;align-self:flex-start;overflow-wrap:anywhere}.together-msg.mine{align-self:flex-end;background:linear-gradient(135deg,#7955cf,#a64d9d)}.together-msg small{display:block;opacity:.72;font-size:10px;margin-top:3px}.together-compose{display:flex;gap:8px;margin-top:9px}.together-compose input{min-width:0;flex:1;background:#ffffff0b;border:1px solid #ffffff20;border-radius:12px;color:var(--text);padding:10px 12px}.together-key{font-size:24px;letter-spacing:2px;font-weight:850;text-align:center;padding:12px;background:#a78bfa12;border:1px dashed #c4b5fd66;border-radius:12px;overflow-wrap:anywhere}.together-pulse{animation:pairPulse .8s ease-in-out 2}@keyframes pairPulse{50%{transform:scale(1.04);filter:drop-shadow(0 0 20px #ff60b7)}}@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%{transform:scale(1)}}
@media(max-width:560px){.together-modal{padding:16px!important}.together-chat{height:210px}.together-key{font-size:19px}}
</style>
<script type="module">
/*
 AURA TOGETHER — real-time partner sync.
 REQUIRED SETUP: Create a Firebase project, enable Anonymous Authentication + Realtime Database,
 then replace the placeholder values below with the project's web config. Do not publish admin keys.
 */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getDatabase, ref, set, update, onValue, push, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const firebaseConfig = {
  apiKey: 'YOUR_FIREBASE_API_KEY',
  authDomain: 'YOUR_PROJECT.firebaseapp.com',
  databaseURL: 'https://YOUR_PROJECT-default-rtdb.firebaseio.com',
  projectId: 'YOUR_PROJECT',
  appId: 'YOUR_FIREBASE_APP_ID'
};
const $ = (s,r=document)=>r.querySelector(s);
const audio = $('#audio');
let auth=null, db=null, uid=null, roomCode=localStorage.getItem('aura_together_room')||'', applyingRemote=false, lastSentAt=0, roomUnsub=null, msgUnsub=null, musicUnsub=null;
let roomData=null, lastRemoteStamp=0;
const configReady = !Object.values(firebaseConfig).some(v=>String(v).startsWith('YOUR_'));
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){let el=$('#togetherNotice');if(!el)return;el.textContent=msg;el.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.hidden=true,4200)}
function vibrate(pattern=[120,70,160]){try{if('vibrate' in navigator)navigator.vibrate(pattern)}catch{}}
function randCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';const b=new Uint8Array(6);crypto.getRandomValues(b);for(const x of b)out+=chars[x%chars.length];return out}
function ensureModal(){let root=$('#auraTogetherRoot');if(!root){root=document.createElement('div');root.id='auraTogetherRoot';document.body.append(root)}return root}
function openTogether(){const root=ensureModal();root.innerHTML=`<div class="modal-backdrop" id="togetherBackdrop"><div class="modal together-modal" role="dialog" aria-modal="true" aria-labelledby="togetherTitle"><div class="modal-head"><h2 id="togetherTitle">💔 AURA TOGETHER</h2><button class="icon-btn" id="togetherClose" aria-label="Close">×</button></div><div class="together-hero"><div class="together-heart">💞</div><div class="together-glow">Listen together, from anywhere.</div><p class="muted tiny">Pair two devices with a shared partner key.</p></div><div id="togetherNotice" class="together-status" hidden></div><div id="togetherSetup"></div><div id="togetherLive" hidden><div class="together-status" id="togetherPairStatus">Waiting for partner…</div><div class="section-head"><h3 style="margin:0">💬 Messages</h3><button class="text-btn" id="togetherCopyKey">Copy partner key</button></div><div id="togetherChat" class="together-chat" aria-live="polite"></div><form id="togetherSendForm" class="together-compose"><input id="togetherMessage" maxlength="500" autocomplete="off" placeholder="Send a message…" aria-label="Message"><button class="btn primary" type="submit">Send</button></form><p class="tiny muted">Keep the page open on both devices. Playback sync depends on both devices having access to the same preview.</p><button class="btn secondary small" id="togetherUnpair" style="margin-top:12px">Unpair this device</button></div><p class="tiny muted" style="margin-top:14px">Your partner key is a private invite code. Only share it with the person you want to pair with.</p></div></div>`;
$('#togetherClose').onclick=closeTogether;$('#togetherBackdrop').onclick=e=>{if(e.target.id==='togetherBackdrop')closeTogether()};renderSetup();if(roomCode)connectRoom(roomCode);}
function closeTogether(){const root=$('#auraTogetherRoot');if(root)root.innerHTML=''}
function renderSetup(){const el=$('#togetherSetup');if(!el)return;el.innerHTML=`<button class="btn primary" id="togetherCreate" style="width:100%">💗 Create my partner key</button><div style="text-align:center;margin:12px;color:var(--muted)">— or enter your partner’s key —</div><form id="togetherJoinForm" class="together-compose"><input id="togetherJoinKey" maxlength="6" autocomplete="off" placeholder="6-character key" aria-label="Partner key" required style="text-transform:uppercase"><button class="btn secondary" type="submit">Connect</button></form><p class="tiny muted">Cross-device pairing needs Firebase setup. Without it, no messages or music sync are sent.</p>`;
$('#togetherCreate').onclick=async()=>{if(!await ready())return;const code=randCode();try{await set(ref(db,'rooms/'+code),{owner:uid,partner:null,createdAt:Date.now(),status:'waiting'});roomCode=code;localStorage.setItem('aura_together_room',code);renderSetup();connectRoom(code)}catch(e){notify('Could not create key. Check Firebase database rules and configuration.')}};
$('#togetherJoinForm').onsubmit=async e=>{e.preventDefault();if(!await ready())return;const code=$('#togetherJoinKey').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6){notify('Enter the 6-character partner key.');return}try{await update(ref(db,'rooms/'+code),{partner:uid,status:'paired'});roomCode=code;localStorage.setItem('aura_together_room',code);connectRoom(code)}catch(err){notify('Could not connect. Check the key, Firebase setup, and database rules.')}};}
async function ready(){if(!configReady){notify('Firebase setup is required for two-phone pairing. Follow the setup notes below the downloaded file.');return false}try{if(!auth){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app)}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;return true}catch(e){notify('Firebase connection failed. Check config, Anonymous Auth, and Realtime Database.');return false}}
function connectRoom(code){if(!db||!uid){renderSetup();return}if(roomUnsub)roomUnsub();if(msgUnsub)msgUnsub();if(musicUnsub)musicUnsub();$('#togetherSetup').hidden=true;$('#togetherLive').hidden=false;$('#togetherPairStatus').textContent='Connecting…';
roomUnsub=onValue(ref(db,'rooms/'+code),snap=>{if(!snap.exists()){$('#togetherPairStatus').textContent='Partner room not found. Check the key.';return}roomData=snap.val();const paired=!!roomData.partner&&roomData.partner!==roomData.owner;$('#togetherPairStatus').textContent=paired?'💞 Connected — you are listening together.':'Key ready: '+code+' · Waiting for your partner to enter it.';$('#togetherCopyKey').textContent='Key: '+code;if(paired){vibrate([100,60,100,60,240]);document.querySelector('.together-heart')?.classList.add('together-pulse');} });
musicUnsub=onValue(ref(db,'rooms/'+code+'/music'),async snap=>{const m=snap.val();if(!m||m.by===uid||m.stamp===lastRemoteStamp)return;lastRemoteStamp=m.stamp;applyingRemote=true;try{if(m.src&&audio.src!==m.src){audio.src=m.src;await new Promise(resolve=>{audio.addEventListener('loadedmetadata',resolve,{once:true});setTimeout(resolve,2200)});$('#playerTitle').textContent=m.title||'Partner is playing';$('#playerArtist').textContent=m.artist||'Aura Together';}if(Number.isFinite(m.time)&&audio.readyState>=1&&Math.abs(audio.currentTime-m.time)>3)audio.currentTime=m.time;if(m.paused||m.action==='pause')audio.pause();else if(m.action==='play'||m.action==='seek'||m.action==='time'){try{await audio.play()}catch{notify('Tap Play once on this device to allow synced playback.')}}}catch(e){console.warn('Aura Together sync:',e)}finally{setTimeout(()=>applyingRemote=false,300)}});
msgUnsub=onValue(ref(db,'rooms/'+code+'/messages'),snap=>{const chat=$('#togetherChat');if(!chat)return;const list=[];snap.forEach(child=>list.push({id:child.key,...child.val()}));chat.innerHTML=list.slice(-100).map(m=>`<div class="together-msg ${m.from===uid?'mine':''}"><strong>${esc(m.name||'Partner')}</strong><div>${esc(m.text)}</div><small>${m.from===uid?'You':'Partner'}</small></div>`).join('');chat.scrollTop=chat.scrollHeight;});
$('#togetherCopyKey').onclick=async()=>{try{await navigator.clipboard.writeText(code);notify('Partner key copied. Send it privately.')}catch{notify('Your partner key is '+code)}};
$('#togetherSendForm').onsubmit=async e=>{e.preventDefault();const input=$('#togetherMessage');const text=input.value.trim();if(!text||!db)return;input.value='';try{await push(ref(db,'rooms/'+code+'/messages'),{from:uid,name:localStorage.getItem('as_demo_key_user_v1')||'Listener',text,at:serverTimestamp()})}catch{notify('Message did not send. Check your connection.')}};
$('#togetherUnpair').onclick=()=>{if(roomUnsub)roomUnsub();if(msgUnsub)msgUnsub();roomCode='';roomData=null;localStorage.removeItem('aura_together_room');$('#togetherLive').hidden=true;$('#togetherSetup').hidden=false;renderSetup();};
}
async function sendMusic(action){if(!db||!uid||!roomCode||applyingRemote||!roomData)return;const paired=roomData.partner&&roomData.partner!==roomData.owner;if(!paired)return;const now=Date.now();if(action==='time'&&now-lastSentAt<1800)return;lastSentAt=now;try{await set(ref(db,'rooms/'+roomCode+'/music'),{by:uid,action,src:audio.currentSrc||audio.src||'',title:$('#playerTitle')?.textContent||'',artist:$('#playerArtist')?.textContent||'',time:audio.currentTime||0,paused:audio.paused,stamp:now})}catch{}}
function subscribeMusic(){ if(roomCode && db) connectRoom(roomCode); }
// Expose local feature state updates without changing the original player implementation.
audio?.addEventListener('play',()=>sendMusic('play'));audio?.addEventListener('pause',()=>sendMusic('pause'));audio?.addEventListener('seeked',()=>sendMusic('seek'));audio?.addEventListener('timeupdate',()=>sendMusic('time'));
const originalOpen=window.openAuraTogether;window.openAuraTogether=openTogether;
function addButton(){const actions=$('.top-actions');if(actions&&!$('#togetherBtn')){const b=document.createElement('button');b.id='togetherBtn';b.className='icon-btn';b.type='button';b.title='Aura Together — partner & messages';b.setAttribute('aria-label','Open partner key and messages');b.textContent='💔';b.onclick=()=>window.openAuraTogether();actions.prepend(b)}
const settingsPage=$('#page');if(settingsPage&&!$('#settingsTogetherBtn')){const rows=settingsPage.querySelectorAll('.setting-row');if(rows.length){const row=document.createElement('div');row.className='setting-row';row.innerHTML='<div><strong>💬 Partner messages</strong><div class="tiny muted">Pair with your partner and sync listening across devices.</div></div><button class="btn secondary small" id="settingsTogetherBtn">Open Aura Together</button>';rows[0].parentNode.insertBefore(row,rows[0]);$('#settingsTogetherBtn').onclick=openTogether;}}}
new MutationObserver(addButton).observe(document.body,{childList:true,subtree:true});addButton();
// Reconnect stored room after configuration has been completed and the user opens the feature.
const oldOpenTogether=openTogether;window.openAuraTogether=async()=>{oldOpenTogether();if(configReady&&roomCode&&await ready())connectRoom(roomCode)};
</script>

</body>
</html>
