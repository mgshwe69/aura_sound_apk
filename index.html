<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101027">
<title>SUIII7SOUND — Official Music Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080612;--purple:#a855f7;--cyan:#00f0ff;
  --glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.15);--muted:rgba(255,255,255,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;min-height:100vh;color:#fff;
  font-family:'Plus Jakarta Sans',sans-serif;
  background:radial-gradient(ellipse at 50% -10%,#a855f7 0%,transparent 40%),
  radial-gradient(ellipse at 10% 50%,#00f0ff22 0%,transparent 45%),
  linear-gradient(180deg,#120a2a,#080612 60%);
  background-attachment:fixed;padding-bottom:120px;overflow-x:hidden;
}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
.topbar{max-width:1100px;margin:auto;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#a855f7,#00f0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
main{max-width:1050px;margin:auto;padding:10px 5%}
.search-wrap{max-width:550px;margin:20px auto;position:relative}
.search-box{display:flex;gap:10px;align-items:center;padding:0 18px;height:52px;border-radius:20px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(25px)}
.search-box input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:14px}
.section-label{font-size:12px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;font-weight:800;margin:25px 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{padding:12px;border:1px solid var(--border);background:rgba(255,255,255,0.05);border-radius:20px;cursor:pointer;transition:.3s;backdrop-filter:blur(15px)}
.card:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 10px 30px rgba(0,240,255,0.2)}
.cover-img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;margin-bottom:10px;box-shadow:0 8px 20px rgba(0,0,0,0.6)}
.card h3{font-size:13px;margin:0 0 4px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:11px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Mini Player */
.player-wrap{position:fixed;z-index:100;left:0;right:0;bottom:0;padding:12px 4%;pointer-events:none}
.player{pointer-events:auto;max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 18px;border:1px solid var(--border);border-radius:24px;background:rgba(18,12,32,0.85);backdrop-filter:blur(30px);box-shadow:0 15px 50px rgba(0,0,0,0.8);cursor:pointer}
.mini-art{width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0}
.track-meta{flex:1;min-width:0}
.track-meta strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-meta small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.play-btn-mini{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,#a855f7,#00f0ff);color:#000;font-size:16px;font-weight:900}

/* Full Screen Player */
.expanded{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:space-between;padding:40px 24px;background:rgba(8,6,18,0.96);backdrop-filter:blur(40px);transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .4s ease}
.expanded.open{transform:translateY(0);opacity:1;pointer-events:auto}
.exp-art-box{display:grid;place-items:center;margin:auto 0}
.big-art-img{width:min(75vw,300px);aspect-ratio:1;border-radius:28px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,0.9);border:1px solid var(--border);transition:0.3s}
.big-art-img.holding{transform:scale(1.08);box-shadow:0 0 45px var(--cyan)}

.lyrics-container{max-height:100px;overflow-y:auto;text-align:center;font-size:13px;color:var(--muted);margin:15px 0;padding:10px;line-height:1.6}
.lyrics-container strong{color:var(--cyan);font-size:15px;display:block}

.progress-bar{width:100%;accent-color:var(--cyan);margin:15px 0}
.controls-row{display:flex;justify-content:center;align-items:center;gap:25px}
.icon-btn{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}
.play-main{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#00f0ff);color:#000;display:grid;place-items:center;font-size:1.6rem;font-weight:900}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">SUIII7SOUND</div>
  <div style="font-size:11px;color:var(--muted);letter-spacing:1px;">OFFICIAL REALTIME ENGINE</div>
</header>

<main>
  <div class="search-wrap">
    <div class="search-box">
      <span>⌕</span>
      <input id="searchInput" placeholder="Search official tracks, artists, albums..." autocomplete="off">
    </div>
  </div>

  <div class="section-label">✦ Trending Hits & Official Songs ✦</div>
  <div class="grid" id="trackGrid"></div>
</main>

<!-- Mini Player -->
<div class="player-wrap">
  <div class="player" id="miniPlayer">
    <img id="miniImg" class="mini-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="">
    <div class="track-meta">
      <strong id="miniTitle">Select a track</strong>
      <small id="miniArtist">Official Artist</small>
    </div>
    <button class="play-btn-mini" id="miniPlayBtn">▶</button>
  </div>
</div>

<!-- Full Player -->
<div class="expanded" id="fullPlayer">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <button class="icon-btn" id="closeFull">⌄</button>
    <div style="font-size:11px;letter-spacing:2px;font-weight:800;color:var(--cyan);">NOW PLAYING</div>
    <div></div>
  </div>

  <div class="exp-art-box" id="artTouchArea">
    <img id="fullImg" class="big-art-img" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="">
  </div>

  <div class="lyrics-container" id="lyricsBox">
    <div id="syncedText">✨ Live Synced Lyrics loading...</div>
  </div>

  <div>
    <h2 id="fullTitle" style="margin:0;font-size:1.3rem;">Song Title</h2>
    <p id="fullArtist" style="margin:4px 0 12px;color:var(--muted);font-size:0.9rem;">Artist Name</p>
    
    <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">

    <div class="controls-row">
      <button class="icon-btn" id="prevBtn">⏮</button>
      <button class="icon-btn play-main" id="fullPlayBtn">▶</button>
      <button class="icon-btn" id="nextBtn">⏭</button>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
let currentTracks = [];
let currentIndex = 0;
let isPlaying = false;
let parsedLyrics = [];
const audio = document.getElementById('audio');

// 1. FETCH OFFICIAL MUSIC FROM ITUNES API
async function fetchMusic(query = "Top English Hits") {
  const grid = document.getElementById('trackGrid');
  grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;">Loading official tracks...</p>';
  
  try {
    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=20`);
    const data = await res.json();
    currentTracks = data.results.map(t => ({
      title: t.trackName,
      artist: t.artistName,
      cover: t.artworkUrl100.replace('100x100bb', '600x600bb'), // HD Album Art
      src: t.previewUrl
    }));
    renderGrid();
  } catch (e) {
    grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;">Error loading music. Check connection.</p>';
  }
}

function renderGrid() {
  const grid = document.getElementById('trackGrid');
  grid.innerHTML = currentTracks.map((t, idx) => `
    <div class="card" onclick="playSong(${idx})">
      <img class="cover-img" src="${t.cover}" alt="">
      <h3>${t.title}</h3>
      <p>${t.artist}</p>
    </div>
  `).join('');
}

// 2. FETCH TIME-SYNCED ENGLISH LYRICS FROM LRCLIB API
async function fetchLyrics(title, artist) {
  const lyricsBox = document.getElementById('syncedText');
  lyricsBox.innerHTML = "Searching live synced lyrics...";
  parsedLyrics = [];
  
  try {
    const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
    const data = await res.json();
    if(data.syncedLyrics) {
      parseLRC(data.syncedLyrics);
    } else if(data.plainLyrics) {
      lyricsBox.innerHTML = `<div>${data.plainLyrics}</div>`;
    } else {
      lyricsBox.innerHTML = "Lyrics not available for this preview track.";
    }
  } catch (e) {
    lyricsBox.innerHTML = "Synced lyrics unavailable.";
  }
}

function parseLRC(lrcText) {
  const lines = lrcText.split('\n');
  const timeRegex = /\[(\d\d):(\d\d\.\d\d)\]/;
  parsedLyrics = [];
  
  lines.forEach(line => {
    const match = timeRegex.exec(line);
    if(match) {
      const min = parseFloat(match[1]);
      const sec = parseFloat(match[2]);
      const time = min * 60 + sec;
      const text = line.replace(timeRegex, '').trim();
      if(text) parsedLyrics.push({ time, text });
    }
  });
}

// 3. AUDIO CONTROL & PLAYER EVENTS
function playSong(index) {
  currentIndex = index;
  const t = currentTracks[index];
  audio.src = t.src;
  
  document.getElementById('miniImg').src = t.cover;
  document.getElementById('fullImg').src = t.cover;
  document.getElementById('miniTitle').textContent = t.title;
  document.getElementById('fullTitle').textContent = t.title;
  document.getElementById('miniArtist').textContent = t.artist;
  document.getElementById('fullArtist').textContent = t.artist;

  audio.play();
  isPlaying = true;
  updateButtons();
  fetchLyrics(t.title, t.artist);
}

function togglePlay() {
  if(!audio.src && currentTracks.length > 0) playSong(0);
  if(isPlaying) { audio.pause(); isPlaying = false; }
  else { audio.play(); isPlaying = true; }
  updateButtons();
}

function updateButtons() {
  document.getElementById('miniPlayBtn').textContent = isPlaying ? "⏸" : "▶";
  document.getElementById('fullPlayBtn').textContent = isPlaying ? "⏸" : "▶";
}

document.getElementById('miniPlayBtn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
document.getElementById('fullPlayBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = () => playSong((currentIndex - 1 + currentTracks.length) % currentTracks.length);
document.getElementById('nextBtn').onclick = () => playSong((currentIndex + 1) % currentTracks.length);

document.getElementById('miniPlayer').onclick = (e) => {
  if(e.target !== document.getElementById('miniPlayBtn'))
    document.getElementById('fullPlayer').classList.add('open');
};
document.getElementById('closeFull').onclick = () => document.getElementById('fullPlayer').classList.remove('open');

// Live Time Sync for ProgressBar & Synced Lyrics
audio.ontimeupdate = () => {
  if(audio.duration) {
    document.getElementById('progressBar').value = (audio.currentTime / audio.duration) * 100;
  }
  
  if(parsedLyrics.length > 0) {
    const curTime = audio.currentTime;
    for(let i = 0; i < parsedLyrics.length; i++) {
      if(curTime >= parsedLyrics[i].time && (!parsedLyrics[i+1] || curTime < parsedLyrics[i+1].time)) {
        document.getElementById('syncedText').innerHTML = `<strong>${parsedLyrics[i].text}</strong>`;
        break;
      }
    }
  }
};

document.getElementById('progressBar').oninput = (e) => {
  if(audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
};

// Search listener
let searchTimeout;
document.getElementById('searchInput').oninput = (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  searchTimeout = setTimeout(() => {
    fetchMusic(q || "Top English Hits");
  }, 500);
};

// Touch & Hold Glow Effect
const artTouchArea = document.getElementById('artTouchArea');
const fullImg = document.getElementById('fullImg');
let holdTimer;
artTouchArea.ontouchstart = () => {
  holdTimer = setTimeout(() => {
    fullImg.classList.add('holding');
    if(navigator.vibrate) navigator.vibrate(50);
  }, 350);
};
artTouchArea.ontouchend = () => { clearTimeout(holdTimer); fullImg.classList.remove('holding'); };

// Initial Load
fetchMusic();
</script>
</body>
</html>
